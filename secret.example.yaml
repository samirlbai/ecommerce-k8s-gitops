# Gabarit de documentation UNIQUEMENT — ne jamais appliquer ce fichier tel quel.
# Les vrais Secrets sont crees imperativement (voir README), jamais commit,
# jamais stockes en clair dans ce depot.
#
# Commandes reelles utilisees :
#
# kubectl create secret generic jwt-secret \
#   --namespace=ecommerce \
#   --from-literal=JWT_SECRET="$(openssl rand -base64 32)"
#
# kubectl create secret generic mongo-uri \
#   --namespace=ecommerce \
#   --from-literal=AUTH_MONGODB_URI="mongodb://mongo:27017/auth" \
#   --from-literal=PRODUCT_MONGODB_URI="mongodb://mongo:27017/ecommerce" \
#   --from-literal=ORDER_MONGODB_URI="mongodb://mongo:27017/orders"

apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: ecommerce
type: Opaque
stringData:
  JWT_SECRET: "<REMPLACER_PAR_UNE_VALEUR_GENEREE_ALEATOIREMENT>"
---
apiVersion: v1
kind: Secret
metadata:
  name: mongo-uri
  namespace: ecommerce
type: Opaque
stringData:
  AUTH_MONGODB_URI: "mongodb://mongo:27017/auth"
  PRODUCT_MONGODB_URI: "mongodb://mongo:27017/ecommerce"
  ORDER_MONGODB_URI: "mongodb://mongo:27017/orders"
